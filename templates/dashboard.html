{% extends "base.html" %}
{% block title %}Descargar envíos{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Descargar envíos de concurso</h1>
    <p class="text-gray-500 text-sm mb-6">Ingresa el slug del concurso (ej. <code class="bg-gray-100 px-1 rounded">ioi2025</code>)</p>
    {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm">{{ error }}</div>
    {% endif %}
    <form method="get" action="/download" class="flex gap-3">
        <input name="slug" type="text" placeholder="slug-del-concurso" required
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit"
            class="bg-blue-600 text-white rounded-lg px-5 py-2 font-medium hover:bg-blue-700 transition whitespace-nowrap">
            Descargar ZIP
        </button>
    </form>
</div>

<div id="loading-modal" style="display:none" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white rounded-xl shadow-lg px-10 py-8 flex flex-col items-center gap-4">
        <div style="
            width: 48px; height: 48px;
            border: 5px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        "></div>
        <p class="text-gray-700 font-medium">Preparando descarga...</p>
    </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
(function () {
    const form = document.querySelector('form[action="/download"]');
    const modal = document.getElementById('loading-modal');

    function getCookie(name) {
        return document.cookie.split(';').some(function (c) {
            const parts = c.trim().split('=');
            return parts[0] === name && parts.length > 1;
        });
    }

    function dismissModal(interval, timeout) {
        clearInterval(interval);
        clearTimeout(timeout);
        document.cookie = 'download_ready=; Max-Age=0; Path=/';
        modal.style.display = 'none';
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const slug = form.querySelector('input[name="slug"]').value;
        const token = crypto.randomUUID().replace(/-/g, '').slice(0, 8);
        modal.style.display = 'flex';

        let interval;
        const timeout = setTimeout(function () {
            dismissModal(interval, timeout);
        }, 60000);

        interval = setInterval(function () {
            if (getCookie('download_ready')) {
                dismissModal(interval, timeout);
            }
        }, 500);

        window.location.href = '/download?slug=' + encodeURIComponent(slug) + '&token=' + token;
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.style.display !== 'none') {
            modal.style.display = 'none';
        }
    });
}());
</script>
{% endblock %}

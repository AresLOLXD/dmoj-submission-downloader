[project]
name = "dmoj-downloader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.5",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.0",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "zipstream-new>=1.1.8",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]
